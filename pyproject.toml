[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-decider-guard"
version = "0.2.0"
description = "Sub-120ms System-1 intent grounding and blast-radius guardrail for Strands Agents using Strands Decider 2B."
readme = "reusable_patterns/decider_guard/README.md"
authors = [{ name = "Vigil-AWS Team", email = "builder@aws.community" }]
license = { text = "Apache-2.0" }
keywords = ["aws", "bedrock", "strands", "decider-2b", "guardrails", "ai-agents", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "strands-agents>=1.59.0",
    "strands-decider>=0.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "rich>=13.8.0",
    "boto3>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reusable_patterns*", "src*"]
