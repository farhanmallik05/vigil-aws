<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="smBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="smSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Light Shadows -->
    <filter id="smCardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="smHeroShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.06"/>
    </filter>

    <marker id="arrowHeadCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0284C7"/>
    </marker>
    <marker id="arrowHeadGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="arrowHeadYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="url(#smBgGrad)"/>
  <rect width="1098" height="618" x="1" y="1" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Light Grid -->
  <g opacity="0.4">
    <pattern id="smGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <rect width="1100" height="620" fill="url(#smGrid)"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="20" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DECIDERGUARD STATE MACHINE</text>
    <text x="0" y="44" fill="#0F172A" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="800">Deterministic 4-Way Reflex Transition Engine</text>
  </g>

  <!-- Initial State Node: Incoming Tool Call -->
  <g transform="translate(50, 260)" filter="url(#smCardShadow)">
    <rect width="180" height="90" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <rect width="180" height="28" rx="12" fill="#FFF7ED"/>
    <text x="90" y="19" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">EVENT / TRIGGER</text>
    <text x="90" y="52" fill="#0F172A" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Proposed Tool Call</text>
    <text x="90" y="70" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">(Tool Name + Params)</text>
  </g>

  <!-- Arrow to Decider Guard -->
  <path d="M 230 305 L 322 305" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrowHeadCyan)"/>

  <!-- Decision State: Strands Decider 2B -->
  <g transform="translate(330, 210)" filter="url(#smHeroShadow)">
    <rect width="250" height="190" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect width="250" height="34" rx="14" fill="url(#smSky)"/>
    <text x="125" y="22" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">STRANDS DECIDER 2B</text>
    
    <text x="20" y="60" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Question Formulation:</text>
    <text x="20" y="78" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Is "{tool}" safe to execute?</text>

    <text x="20" y="106" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Evaluation Latency:</text>
    <text x="20" y="124" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">⚡ 114.6 ms (System-1)</text>

    <text x="20" y="152" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Calibrated Output:</text>
    <text x="20" y="170" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">P(Safe) ∈ [0.0, 1.0]</text>
  </g>

  <!-- Branch 1: PROCEED (Top Right) -->
  <path d="M 580 250 C 640 250, 670 120, 722 120" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowHeadGreen)"/>
  <text x="640" y="180" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">P(Safe) ≥ 0.85</text>

  <g transform="translate(730, 75)" filter="url(#smCardShadow)">
    <rect width="320" height="90" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="#ECFDF5"/>
    <text x="160" y="18" fill="#065F46" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: PROCEED (AUTONOMOUS)</text>
    <text x="16" y="46" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Dispatches directly to AWS Boto3 SDK</text>
    <text x="16" y="64" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Asynchronously kicks off Bedrock RCA</text>
    <text x="16" y="80" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">• Emits CloudWatch EMF latency metrics</text>
  </g>

  <!-- Branch 2: CONFIRM (Middle Right Top) -->
  <path d="M 580 285 C 640 285, 670 235, 722 235" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrowHeadYellow)"/>
  <text x="626" y="255" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">0.65 ≤ P &lt; 0.85</text>

  <g transform="translate(730, 190)" filter="url(#smCardShadow)">
    <rect width="320" height="90" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="#FFFBEB"/>
    <text x="160" y="18" fill="#92400E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: CONFIRM (HUMAN-IN-THE-LOOP)</text>
    <text x="16" y="46" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Halts tool execution pending approval</text>
    <text x="16" y="64" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Dispatches webhook to SRE Slack/PagerDuty</text>
    <text x="16" y="80" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">• Auto-times-out to DENY if unacknowledged</text>
  </g>

  <!-- Branch 3: DENY (Middle Right Bottom) -->
  <path d="M 580 325 C 640 325, 670 350, 722 350" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowHeadRed)"/>
  <text x="626" y="340" fill="#B91C1C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">P(Safe) &lt; 0.65</text>

  <g transform="translate(730, 305)" filter="url(#smCardShadow)">
    <rect width="320" height="90" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="#FEF2F2"/>
    <text x="160" y="18" fill="#991B1B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: DENY (HARD INTERCEPT)</text>
    <text x="16" y="46" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Tool call rejected; zero AWS resources touched</text>
    <text x="16" y="64" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Logs threat signature to AWS GuardDuty</text>
    <text x="16" y="80" fill="#B91C1C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">• Prevents prompt injection &amp; fleet deletion</text>
  </g>

  <!-- Branch 4: GUIDE (Bottom Right) -->
  <path d="M 580 365 C 640 365, 670 465, 722 465" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowHeadCyan)"/>
  <text x="635" y="420" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Ambiguous / Vague</text>

  <g transform="translate(730, 420)" filter="url(#smCardShadow)">
    <rect width="320" height="90" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="#F0F9FF"/>
    <text x="160" y="18" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: GUIDE (FALLBACK ADAPTATION)</text>
    <text x="16" y="46" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Generates parameter clarification guidance</text>
    <text x="16" y="64" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• Re-prompts agent for missing resource IDs</text>
    <text x="16" y="80" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">• Self-healing without human intervention</text>
  </g>

  <!-- Feedback Loop from GUIDE back to Initial State -->
  <path d="M 890 515 C 890 575, 140 575, 140 358" stroke="#0284C7" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowHeadCyan)"/>
  <text x="515" y="565" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">Loop 1-2 Guided Reformulation Cycle</text>
</svg>
