<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="smBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="smCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowHeadCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#00F2FE"/>
    </marker>
    <marker id="arrowHeadGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981"/>
    </marker>
    <marker id="arrowHeadYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="url(#smBgGrad)"/>

  <!-- Subtle Grid -->
  <g opacity="0.05">
    <pattern id="smGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F2FE" stroke-width="1"/>
    </pattern>
    <rect width="1100" height="620" fill="url(#smGrid)"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="20" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DECIDERGUARD STATE MACHINE</text>
    <text x="0" y="44" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="22" font-weight="800">Deterministic 4-Way Reflex Transition Engine</text>
  </g>

  <!-- Initial State Node: Incoming Tool Call -->
  <g transform="translate(50, 260)">
    <rect width="180" height="90" rx="12" fill="#0D1424" stroke="rgba(255, 153, 0, 0.6)" stroke-width="2"/>
    <rect width="180" height="28" rx="12" fill="rgba(255, 153, 0, 0.15)"/>
    <text x="90" y="19" fill="#FF9900" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">EVENT / TRIGGER</text>
    <text x="90" y="52" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Proposed Tool Call</text>
    <text x="90" y="70" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">(Tool Name + Params)</text>
  </g>

  <!-- Arrow to Decider Guard -->
  <path d="M 230 305 L 320 305" stroke="#00F2FE" stroke-width="2" marker-end="url(#arrowHeadCyan)"/>

  <!-- Decision State: Strands Decider 2B -->
  <g transform="translate(330, 210)">
    <rect width="250" height="190" rx="14" fill="#0D1424" stroke="#00F2FE" stroke-width="2" filter="url(#glowEffect)"/>
    <rect width="250" height="34" rx="14" fill="url(#smCyan)" opacity="0.2"/>
    <text x="125" y="22" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">STRANDS DECIDER 2B</text>
    
    <text x="20" y="60" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Question Formulation:</text>
    <text x="20" y="78" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Is "{tool}" safe to execute?</text>

    <text x="20" y="106" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Evaluation Latency:</text>
    <text x="20" y="124" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">⚡ 114.6 ms (System-1)</text>

    <text x="20" y="152" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Calibrated Output:</text>
    <text x="20" y="170" fill="#FF9900" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">P(Safe) ∈ [0.0, 1.0]</text>
  </g>

  <!-- Branch 1: PROCEED (Top Right) -->
  <path d="M 580 250 C 640 250, 670 120, 720 120" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrowHeadGreen)"/>
  <text x="640" y="180" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">P(Safe) ≥ 0.85</text>

  <g transform="translate(730, 75)">
    <rect width="320" height="90" rx="12" fill="#0D1424" stroke="#10B981" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="160" y="18" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: PROCEED (AUTONOMOUS)</text>
    <text x="16" y="46" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Dispatches directly to AWS Boto3 SDK</text>
    <text x="16" y="64" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Asynchronously kicks off Bedrock RCA</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">• Emits CloudWatch EMF latency metrics</text>
  </g>

  <!-- Branch 2: CONFIRM (Middle Right Top) -->
  <path d="M 580 285 C 640 285, 670 235, 720 235" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrowHeadYellow)"/>
  <text x="626" y="255" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">0.65 ≤ P &lt; 0.85</text>

  <g transform="translate(730, 190)">
    <rect width="320" height="90" rx="12" fill="#0D1424" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="160" y="18" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: CONFIRM (HUMAN-IN-THE-LOOP)</text>
    <text x="16" y="46" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Halts tool execution pending approval</text>
    <text x="16" y="64" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Dispatches webhook to SRE Slack/PagerDuty</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">• Auto-times-out to DENY if unacknowledged</text>
  </g>

  <!-- Branch 3: DENY (Middle Right Bottom) -->
  <path d="M 580 325 C 640 325, 670 350, 720 350" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrowHeadRed)"/>
  <text x="626" y="340" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">P(Safe) &lt; 0.65</text>

  <g transform="translate(730, 305)">
    <rect width="320" height="90" rx="12" fill="#0D1424" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="160" y="18" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: DENY (HARD INTERCEPT)</text>
    <text x="16" y="46" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Tool call rejected; zero AWS resources touched</text>
    <text x="16" y="64" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Logs threat signature to AWS GuardDuty</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">• Prevents prompt injection &amp; fleet deletion</text>
  </g>

  <!-- Branch 4: GUIDE (Bottom Right) -->
  <path d="M 580 365 C 640 365, 670 465, 720 465" stroke="#00F2FE" stroke-width="2" fill="none" marker-end="url(#arrowHeadCyan)"/>
  <text x="635" y="420" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Ambiguous / Vague</text>

  <g transform="translate(730, 420)">
    <rect width="320" height="90" rx="12" fill="#0D1424" stroke="#00F2FE" stroke-width="1.8"/>
    <rect width="320" height="26" rx="12" fill="rgba(0, 242, 254, 0.15)"/>
    <text x="160" y="18" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">STATE: GUIDE (FALLBACK ADAPTATION)</text>
    <text x="16" y="46" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Generates parameter clarification guidance</text>
    <text x="16" y="64" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• Re-prompts agent for missing resource IDs</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">• Self-healing without human intervention</text>
  </g>

  <!-- Feedback Loop from GUIDE back to Initial State -->
  <path d="M 890 515 C 890 575, 140 575, 140 355" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowHeadCyan)"/>
  <text x="515" y="565" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Loop 1-2 Guided Reformulation Cycle</text>
</svg>
