    <path d="M 670 304 L 750 200" stroke-dasharray="4 4"/>
    <polygon points="750,195 758,200 750,205" fill="#10B981"/>
  </g>
  <g stroke="#F59E0B" stroke-width="2" fill="none">
    <path d="M 670 352 L 750 310" stroke-dasharray="4 4"/>
    <polygon points="750,305 758,310 750,315" fill="#F59E0B"/>
  </g>
  <g stroke="#EF4444" stroke-width="2" fill="none">
