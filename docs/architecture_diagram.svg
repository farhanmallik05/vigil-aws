      <text x="15" y="78" fill="#334155" font-family="'Inter', sans-serif" font-size="11">• Multimodal diagram pre-flight check</text>
    </g>

    <!-- 4 Decision Threshold Branches -->
    <g transform="translate(25, 282)">
      <!-- Branch PROCEED -->
      <g transform="translate(0, 0)">
        <rect width="270" height="42" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
        <text x="12" y="25" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[PROCEED]</text>
        <text x="88" y="25" fill="#065F46" font-family="'JetBrains Mono', monospace" font-size="10">Score ≥ 0.85 (Safe &amp; Grounded)</text>
      </g>
      <!-- Branch CONFIRM -->
      <g transform="translate(0, 48)">
        <rect width="270" height="42" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
        <text x="12" y="25" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[CONFIRM]</text>
        <text x="88" y="25" fill="#92400E" font-family="'JetBrains Mono', monospace" font-size="10">0.65 ≤ Score &lt; 0.85 (Human Sign-off)</text>
      </g>
      <!-- Branch DENY -->
      <g transform="translate(0, 96)">
        <rect width="270" height="42" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
        <text x="12" y="25" fill="#B91C1C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[DENY]</text>
        <text x="88" y="25" fill="#991B1B" font-family="'JetBrains Mono', monospace" font-size="10">Score &lt; 0.65 (Destructive/Injected)</text>
      </g>
      <!-- Branch GUIDE -->
      <g transform="translate(0, 144)">
        <rect width="270" height="42" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
        <text x="12" y="25" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[GUIDE]</text>
        <text x="88" y="25" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="10">Ambiguous (Targeted Reformulation)</text>
      </g>
    </g>
