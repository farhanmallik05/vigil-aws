        <rect width="344" height="66" rx="8" fill="#131D33" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <text x="14" y="22" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AMAZON BEDROCK (Claude 3.5 Sonnet)</text>
        <text x="14" y="42" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Asynchronous deep Root Cause Analysis (RCA)</text>
        <text x="14" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Runs in background without gating critical reflex fixes</text>
