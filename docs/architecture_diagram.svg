    <rect width="210" height="490" rx="14" fill="#0D1424" fill-opacity="0.85" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="210" height="42" rx="14" fill="rgba(56, 189, 248, 0.08)"/>
    <text x="105" y="26" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">01 · INCIDENT INGESTION</text>

    <!-- Source Items -->
    <g transform="translate(18, 65)">
      <rect width="174" height="68" rx="8" fill="#131D33" stroke="rgba(255, 153, 0, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#FF9900" opacity="0.2"/>
      <circle cx="24" cy="24" r="4" fill="#FF9900"/>
      <text x="40" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CloudWatch Alarms</text>
      <text x="40" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">High RDS CPU / OOM</text>
    </g>

    <g transform="translate(18, 148)">
      <rect width="174" height="68" rx="8" fill="#131D33" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#EF4444" opacity="0.2"/>
      <circle cx="24" cy="24" r="4" fill="#EF4444"/>
      <text x="40" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PagerDuty Trigger</text>
      <text x="40" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Fleet Degraded P1</text>
    </g>

    <g transform="translate(18, 231)">
      <rect width="174" height="68" rx="8" fill="#131D33" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#00F2FE" opacity="0.2"/>
      <circle cx="24" cy="24" r="4" fill="#00F2FE"/>
      <text x="40" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SRE Operator CLI</text>
      <text x="40" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Ad-hoc Remediation</text>
    </g>

    <g transform="translate(18, 314)">
      <rect width="174" height="68" rx="8" fill="#131D33" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#A78BFA" opacity="0.2"/>
      <circle cx="24" cy="24" r="4" fill="#A78BFA"/>
      <text x="40" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Arch Diagram Scan</text>
      <text x="40" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Multimodal Topology</text>
    </g>

