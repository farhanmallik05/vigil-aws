        <rect width="270" height="42" rx="6" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-width="1.2"/>
        <text x="12" y="25" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[DENY]</text>
        <text x="88" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Score &lt; 0.65 (Destructive/Injected)</text>
