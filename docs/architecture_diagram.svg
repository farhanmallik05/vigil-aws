  <!-- Clean Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect width="1198" height="678" x="1" y="1" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Pattern (Light) -->
  <g opacity="0.45">
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="680" fill="url(#lightGrid)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="144" height="26" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <text x="72" y="17" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">AWS AGENT CHALLENGE</text>

    <text x="160" y="20" fill="#0F172A" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">VIGIL-AWS: DUAL-SPEED AGENT ARCHITECTURE</text>
    <text x="0" y="44" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
      System-1 (~115ms Reflex Guard via Strands Decider 2B) + System-2 (~1,650ms Deliberation via Amazon Bedrock Claude 3.5)
    </text>
  </g>

  <!-- Left: Incident Ingestion Column (01) -->
  <g transform="translate(60, 126)">
    <!-- Boundary Card -->
    <rect width="210" height="494" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lightCardShadow)"/>
    <rect width="210" height="42" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <text x="105" y="26" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">01 · INCIDENT INGESTION</text>

    <!-- Source Items -->
    <g transform="translate(18, 64)">
      <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#FFEDD5"/>
      <circle cx="24" cy="24" r="4" fill="#EA580C"/>
      <text x="40" y="28" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CloudWatch Alarms</text>
      <text x="40" y="46" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">High RDS CPU / OOM</text>
    </g>

    <g transform="translate(18, 147)">
      <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#FEE2E2"/>
      <circle cx="24" cy="24" r="4" fill="#DC2626"/>
      <text x="40" y="28" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PagerDuty Trigger</text>
      <text x="40" y="46" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Fleet Degraded P1</text>
    </g>

    <g transform="translate(18, 230)">
      <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#E0F2FE"/>
      <circle cx="24" cy="24" r="4" fill="#0284C7"/>
      <text x="40" y="28" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SRE Operator CLI</text>
      <text x="40" y="46" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Ad-hoc Remediation</text>
    </g>

    <g transform="translate(18, 313)">
      <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#EDE9FE"/>
      <circle cx="24" cy="24" r="4" fill="#7C3AED"/>
      <text x="40" y="28" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Arch Diagram Scan</text>
      <text x="40" y="46" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Multimodal Topology</text>
    </g>

    <g transform="translate(18, 396)">
      <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#D1FAE5"/>
      <circle cx="24" cy="24" r="4" fill="#059669"/>
      <text x="40" y="28" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Chaos Simulator</text>
      <text x="40" y="46" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">4 Synthetic Probes</text>
    </g>
