      <!-- CloudWatch EMF -->
      <g transform="translate(18, 126)">
        <rect width="344" height="74" rx="8" fill="#131D33" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1"/>
        <text x="14" y="22" fill="#FF9900" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AWS CLOUDWATCH EMBEDDED METRICS (EMF)</text>
        <text x="14" y="42" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Namespace: VigilAWS/Decider2B</text>
        <text x="14" y="60" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Metrics: ReflexLatencyMs, GroundingScore, CostSaved</text>
