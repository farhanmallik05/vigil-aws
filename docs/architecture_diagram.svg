        <rect width="270" height="42" rx="6" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1.2"/>
        <text x="12" y="25" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[GUIDE]</text>
        <text x="88" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Ambiguous (Targeted Reformulation)</text>
