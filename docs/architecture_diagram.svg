  <!-- Flow Arrows: System 1 -> Dispatch / System 2 -->
  <path d="M 670 304 C 710 304, 715 200, 752 200" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 670 352 C 710 352, 715 310, 752 310" stroke="#D97706" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M 670 400 C 710 400, 715 395, 752 395" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 670 450 C 710 450, 715 515, 752 515" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Right: Execution & Deliberation Column (03) -->
  <g transform="translate(760, 126)">
    <!-- Top Box: Autonomous AWS Execution (03A) -->
    <g transform="translate(0, 0)">
      <rect width="380" height="130" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lightCardShadow)"/>
      <rect width="380" height="34" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="190" y="22" fill="#065F46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">
