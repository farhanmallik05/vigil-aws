      <rect width="174" height="68" rx="8" fill="#131D33" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#10B981" opacity="0.2"/>
      <circle cx="24" cy="24" r="4" fill="#10B981"/>
