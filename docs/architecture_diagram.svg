  <!-- Flow Arrow: Ingestion -> System 1 -->
  <path d="M 270 373 L 342 373" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- Center: System-1 Reflex Interceptor (Strands Decider 2B) (02) -->
  <g transform="translate(350, 126)">
    <rect width="320" height="494" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#heroShadow)"/>
    
    <!-- Title Bar -->
