    <g transform="translate(0, 146)">
      <rect width="380" height="110" rx="14" fill="#0D1424" fill-opacity="0.85" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect width="380" height="34" rx="14" fill="rgba(245, 158, 11, 0.12)"/>
      <text x="190" y="22" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">
