      </text>
      <text x="20" y="60" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• CONFIRM: Posts interactive webhook to Slack / PagerDuty</text>
      <text x="20" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">• DENY: Hard-stop aborts execution &amp; alerts AWS GuardDuty</text>
      <text x="20" y="98" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Preserves blast radius zero on adversarial or unsafe actions</text>
