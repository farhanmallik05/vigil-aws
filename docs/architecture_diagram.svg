      <g transform="translate(98, 74)">
        <rect width="66" height="26" rx="4" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
        <text x="33" y="17" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">EC2 Fleet</text>
      </g>
      <g transform="translate(172, 74)">
        <rect width="66" height="26" rx="4" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
        <text x="33" y="17" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AutoScale</text>
      </g>
      <g transform="translate(246, 74)">
        <rect width="76" height="26" rx="4" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
        <text x="38" y="17" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">S3 Policies</text>
      </g>
      <text x="20" y="118" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">✓ zero tokens consumed | sub-millisecond execution</text>
    </g>

    <!-- Middle Box: Human In The Loop & Safety Revocation (03B) -->
    <g transform="translate(0, 146)">
      <rect width="380" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lightCardShadow)"/>
      <rect width="380" height="34" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
      <text x="190" y="22" fill="#92400E" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">
        03B · HUMAN-IN-THE-LOOP &amp; REVOCATION
      </text>
      <text x="20" y="60" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• CONFIRM: Posts interactive webhook to Slack / PagerDuty</text>
      <text x="20" y="80" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12">• DENY: Hard-stop aborts execution &amp; alerts AWS GuardDuty</text>
      <text x="20" y="98" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Preserves blast radius zero on adversarial or unsafe actions</text>
    </g>

    <!-- Bottom Box: System-2 Bedrock Deliberation & CloudWatch EMF (03C) -->
    <g transform="translate(0, 272)">
      <rect width="380" height="222" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lightCardShadow)"/>
      <rect width="380" height="34" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="190" y="22" fill="#5B21B6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">
        03C · SYSTEM-2 BEDROCK &amp; OBSERVABILITY
      </text>

      <!-- Bedrock Claude RCA -->
      <g transform="translate(18, 48)">
        <rect width="344" height="66" rx="8" fill="#F8FAFC" stroke="#DDD6FE" stroke-width="1"/>
        <text x="14" y="22" fill="#6D28D9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AMAZON BEDROCK (Claude 3.5 Sonnet)</text>
        <text x="14" y="42" fill="#334155" font-family="'Inter', sans-serif" font-size="11">Asynchronous deep Root Cause Analysis (RCA)</text>
        <text x="14" y="58" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Runs in background without gating critical reflex fixes</text>
      </g>

      <!-- CloudWatch EMF -->
      <g transform="translate(18, 126)">
        <rect width="344" height="78" rx="8" fill="#F8FAFC" stroke="#FED7AA" stroke-width="1"/>
        <text x="14" y="22" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AWS CLOUDWATCH EMBEDDED METRICS (EMF)</text>
        <text x="14" y="42" fill="#334155" font-family="'Inter', sans-serif" font-size="11">Namespace: VigilAWS/Decider2B</text>
        <text x="14" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Metrics: ReflexLatencyMs, GroundingScore, CostSaved</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric Bar (Light) -->
  <g transform="translate(60, 634)">
    <rect width="1080" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="540" y="19" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">
      ⚡ DECIDER 2B P50: 114.6MS · BEDROCK P50: 1650.0MS · SPEEDUP: 14.7X · SAVINGS: $20.00/1K ACTIONS · RELIABILITY: 100% SRE BLAST-RADIUS CONTAINED
