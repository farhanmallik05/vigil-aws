      <!-- Branch CONFIRM -->
      <g transform="translate(0, 48)">
        <rect width="270" height="42" rx="6" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.2"/>
        <text x="12" y="25" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">[CONFIRM]</text>
        <text x="88" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">0.65 ≤ Score &lt; 0.85 (Human Approval)</text>
      </g>
      <!-- Branch DENY -->
