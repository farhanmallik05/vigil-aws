      </text>
      <text x="20" y="60" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Dispatches via Boto3 AWS SDK:</text>
      <g transform="translate(20, 74)">
        <rect width="70" height="26" rx="4" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
        <text x="35" y="17" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">RDS Aurora</text>
